<!doctype html>
<!-- ============================================================
  NEXUS CHAT — fully responsive single-file build (v1)
  HOW TO RUN: save as index.html, double-click / serve locally.
  TEST SYNC: open the file in TWO tabs — messages, typing, read
  receipts and joins sync live (BroadcastChannel + localStorage).
  NEXT STEP: split into /css /js /components or port to React,
  then swap ChatService mock for Firebase/Socket.IO.
============================================================ -->
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nexus Chat — Connect • Chat • Share • Together</title>
<style>
/* ---------- DESIGN TOKENS ---------- */
:root,[data-theme="dark"]{
  --bg:#08070f; --bg2:#0d0b16; --card:#141122; --card2:#1b1730; --line:rgba(139,92,246,.18);
  --txt:#f1eefc; --mut:#9a93b8; --danger:#f43f5e; --ok:#34d399;
  --glow:0 0 24px rgba(124,58,237,.35); --scrim:rgba(5,4,12,.72);
}
[data-theme="light"]{
  --bg:#f2f0fa; --bg2:#ffffff; --card:#ffffff; --card2:#f2edfc; --line:rgba(124,58,237,.16);
  --txt:#17122b; --mut:#6b6584; --glow:0 8px 24px rgba(124,58,237,.15); --scrim:rgba(30,25,60,.45);
}
[data-accent="violet"]{--acc:#7c3aed;--acc2:#a855f7;--grad:linear-gradient(135deg,#7c3aed,#a855f7)}
[data-accent="blue"]  {--acc:#2563eb;--acc2:#38bdf8;--grad:linear-gradient(135deg,#2563eb,#38bdf8)}
[data-accent="pink"]  {--acc:#db2777;--acc2:#f472b6;--grad:linear-gradient(135deg,#db2777,#f472b6)}
[data-accent="green"] {--acc:#059669;--acc2:#34d399;--grad:linear-gradient(135deg,#059669,#34d399)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 85% -10%,rgba(124,58,237,.25),transparent 60%),
             radial-gradient(500px 380px at -10% 110%,rgba(168,85,247,.18),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt)}
.ic{width:20px;height:20px;flex:none}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;color:var(--mut);transition:.2s}
.ibtn:hover{background:var(--card2);color:var(--txt)}
.ibtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;font-weight:700;color:#fff;user-select:none}
.av .dot{position:absolute;right:0;bottom:0;width:26%;height:26%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
[hidden]{display:none!important}

/* ---------- AUTH ---------- */
.auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(700px 500px at 70% 10%,rgba(124,58,237,.35),transparent 60%),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--glow)}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.logo .mark{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:var(--glow)}
.logo h1{font-size:26px}.logo h1 em{font-style:normal;color:var(--acc2)}
.auth-sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 20px}
.field{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--mut)}
.field input{background:none;border:0;outline:0;width:100%;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--glow);transition:.2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.link{color:var(--acc2);font-size:13px}
.tabs2{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs2 button{flex:1;padding:9px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px}
.tabs2 button.on{background:var(--grad);color:#fff}
.otp{display:flex;gap:10px;justify-content:center;margin:18px 0}
.otp input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:12px;outline:0}
.otp input:focus{border-color:var(--acc2)}
.feat{display:flex;justify-content:space-between;margin:18px 0;text-align:center}
.feat div{font-size:11px;color:var(--mut);display:grid;gap:8px;justify-items:center}
.feat .ic{width:22px;height:22px;color:var(--acc2)}

/* ---------- APP SHELL ---------- */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto}
.rail{display:none}
.pane-list{display:flex;flex-direction:column;min-width:0;background:var(--bg2);border-right:1px solid var(--line)}
.pane-chat{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .28s ease}
.app.chat-open .pane-chat{transform:none}
.pane-details{display:none}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg2) 85%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{display:grid;justify-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--mut);font-size:10.5px;font-weight:600;min-height:44px}
.tabbar button.on{color:var(--acc2)}
.tabbar button.on .ic{filter:drop-shadow(0 0 6px var(--acc2))}

/* list pane */
.lhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.lhead h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-btn{width:36px;height:36px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--glow)}
.searchbar{display:flex;align-items:center;gap:8px;margin:0 14px 10px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--mut)}
.searchbar input{flex:1;background:none;border:0;outline:0;font-size:13px}
.searchbar kbd{font:600 10px/1 Inter;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--mut)}
.filters{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}
.filters button{flex:none;padding:7px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:12px;font-weight:600}
.filters button.on{background:var(--grad);border-color:transparent;color:#fff}
.stories{display:flex;gap:12px;padding:2px 14px 12px;overflow-x:auto}
.story{display:grid;justify-items:center;gap:6px;flex:none;font-size:10.5px;color:var(--mut);width:64px}
.story .ring{padding:3px;border-radius:50%;background:conic-gradient(var(--acc2),var(--acc),var(--acc2))}
.story.seen .ring{background:var(--line)}
.story .ring>span{display:block;padding:2px;border-radius:50%;background:var(--bg2)}
.list{flex:1;overflow-y:auto;padding-bottom:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;transition:.15s}
.row:hover,.row.on{background:var(--card)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row .mid b time{font-size:11px;font-weight:500;color:var(--mut);flex:none}
.row .mid p{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{display:grid;justify-items:end;gap:6px}

/* chat pane */
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.chead .who{flex:1;min-width:0}
.chead .who b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .who i{font-size:11.5px;color:var(--ok);font-style:normal}
.chead .who i.typing{color:var(--acc2)}
#backBtn{display:inline-flex}
.msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(500px 300px at 90% 0%,rgba(124,58,237,.10),transparent 60%)}
.day{align-self:center;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:600;border-radius:999px;padding:5px 14px;margin:4px 0}
.msg{position:relative;max-width:82%;padding:9px 12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.45;word-wrap:break-word;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.msg.me{align-self:flex-end;background:var(--grad);border:0;color:#fff;border-bottom-right-radius:6px}
.msg:not(.me){border-bottom-left-radius:6px}
.msg .who{display:block;font-size:11.5px;font-weight:700;color:var(--acc2);margin-bottom:3px}
.msg .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10px;opacity:.75;margin-top:3px}
.msg .meta .tk{letter-spacing:-4px;margin-left:2px}
.msg .quote{border-left:3px solid var(--acc2);background:rgba(0,0,0,.18);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:12px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .mimg{display:block;width:min(260px,60vw);border-radius:12px;margin:4px 0}
.msg .file{display:flex;align-items:center;gap:10px;margin:4px 0}
.msg .file .fi{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.msg .file b{font-size:12.5px;display:block}.msg .file i{font-size:10.5px;opacity:.7;font-style:normal}
.msg .voice{display:flex;align-items:center;gap:8px;margin:2px 0}
.msg .bars{display:flex;align-items:center;gap:2px;height:22px}
.msg .bars span{width:3px;border-radius:2px;background:currentColor;opacity:.8}
.msg .react{position:absolute;bottom:-10px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 6px;font-size:12px}
.msg .acts{position:absolute;top:-12px;right:6px;display:none;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 5px;font-size:11px}
.msg:hover .acts{display:flex}
.typing-bub{display:flex;gap:4px;padding:12px 14px}
.typing-bub span{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing-bub span:nth-child(2){animation-delay:.15s}.typing-bub span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);position:relative}
.composer .in{flex:1;display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.composer .in input{flex:1;background:none;border:0;outline:0;font-size:14px;min-width:0}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--glow)}
.sendbtn:active{transform:scale(.92)}
.replybar{position:absolute;left:12px;right:12px;bottom:calc(100% + 4px);display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mut)}
.replybar b{color:var(--txt)}
.pop{position:absolute;bottom:calc(100% + 8px);left:12px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--glow);display:grid;gap:4px}
.pop button{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600}
.pop button:hover{background:var(--card2)}
.emojis{grid-template-columns:repeat(6,40px)}
.emojis button{justify-content:center;font-size:20px;padding:6px}
.empty{flex:1;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--mut);text-align:center;padding:30px}
.empty .mark{width:70px;height:70px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:32px;box-shadow:var(--glow)}

/* details pane */
.pane-details{flex-direction:column;gap:12px;overflow-y:auto;padding:12px;background:var(--bg2)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.dcover{height:90px;margin:-16px -16px 0;border-radius:18px 18px 0 0;background:var(--grad);opacity:.85}
.dhead{display:grid;justify-items:center;gap:6px;margin-top:-34px;text-align:center}
.dhead .av{border:3px solid var(--card)}
.dhead b{font-size:17px}.dhead i{font-style:normal;color:var(--mut);font-size:12px}
.dhead p{font-size:11.5px;color:var(--mut)}
.dacts{display:flex;justify-content:space-between;margin-top:14px}
.dacts button{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--mut);width:56px;height:52px;border-radius:14px}
.dacts button:hover{background:var(--card2);color:var(--acc2)}
.dacts .ic{width:18px;height:18px;background:var(--card2);border-radius:50%;padding:8px;width:34px;height:34px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.mgrid .f{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut);font-size:11px;font-weight:700}
.dcard h4{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dcard h4 a{color:var(--acc2);font-size:11px;font-weight:600;cursor:pointer}
.about p{font-size:12.5px;color:var(--mut);line-height:1.5}
.about div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:8px}
.grow{display:flex;align-items:center;gap:10px;padding:7px 0}
.grow .mid{flex:1;min-width:0}.grow .mid b{font-size:12.5px;display:block}.grow .mid i{font-style:normal;font-size:11px;color:var(--mut)}

/* profile / settings views */
.pcard{margin:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.pcard .cover{height:100px;margin:-18px -18px 0;border-radius:20px 20px 0 0;background:var(--grad)}
.pcard .av{margin-top:-40px;border:4px solid var(--card)}
.pcard h3{margin-top:8px;font-size:18px}
.pcard .handle{color:var(--mut);font-size:12.5px}
.pcard .tags{color:var(--mut);font-size:11.5px;margin-top:6px}
.pcard .quote2{font-size:12px;color:var(--mut);font-style:italic;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.kv:last-child{border:0}
.kv .l{display:flex;gap:12px;align-items:center;color:var(--txt)}
.kv .l .ic{color:var(--acc2)}
.kv .v{color:var(--mut);display:flex;align-items:center;gap:8px}
.card{margin:0 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card .kv.danger .l{color:var(--danger)}.card .kv.danger .l .ic{color:var(--danger)}
.sw{width:44px;height:24px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:var(--grad);border-color:transparent}
.sw.on::after{left:22px;background:#fff}
.swatches{display:flex;gap:8px}
.swatches button{width:22px;height:22px;border-radius:50%}

/* overlays */
.ovl{position:fixed;inset:0;z-index:70;background:var(--scrim);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
.callbox{display:grid;justify-items:center;gap:14px;color:#fff;text-align:center}
.callbox .av{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,85,247,.5)}70%{box-shadow:0 0 0 34px rgba(168,85,247,0)}100%{box-shadow:0 0 0 0 rgba(168,85,247,0)}}
.callbox b{font-size:22px}.callbox i{font-style:normal;color:var(--mut);font-size:13px}
.callacts{display:flex;gap:16px;margin-top:10px}
.callacts button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.callacts button.end{background:var(--danger)}
.callacts button.on{background:var(--grad)}
.vgrid{display:grid;gap:10px;width:min(760px,100%)}
.vgrid .tile{aspect-ratio:16/9;border-radius:18px;background:var(--grad);opacity:.8;display:grid;place-items:center;color:#fff;font-weight:700}
.vgrid .tile.self{position:absolute;right:26px;bottom:110px;width:120px;aspect-ratio:3/4;background:var(--card2);border:1px solid var(--line)}
#storyView{background:#000;flex-direction:column;padding:0}
.sbar{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;width:100%}
.sbar span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sbar span i{display:block;height:100%;width:0;background:#fff}
.shead{display:flex;align-items:center;gap:10px;width:100%;padding:0 12px 10px;color:#fff}
.shead b{font-size:14px;flex:1}
.sbody{flex:1;width:100%;display:grid;place-items:center;background-size:cover;background-position:center;position:relative}
.sbody .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#fff;font-size:15px;font-weight:600;text-shadow:0 2px 10px #000}
.sz{position:absolute;top:0;bottom:0;width:35%}
.modal{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.modal h3{margin-bottom:14px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13px;box-shadow:var(--glow);animation:pop .2s}

/* ---------- TABLET ≥768 : rail + 2 panes ---------- */
@media (min-width:768px){
  .app{grid-template-columns:68px 340px 1fr;grid-template-rows:1fr}
  .rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;background:var(--bg2);border-right:1px solid var(--line)}
  .rail .mark{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:19px;box-shadow:var(--glow);margin-bottom:10px}
  .rail button{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--mut);position:relative}
  .rail button.on{color:var(--acc2);background:var(--card2)}
  .rail button.on::before{content:"";position:absolute;left:-11px;width:3px;height:22px;border-radius:2px;background:var(--grad)}
  .rail .sp{flex:1}
  .tabbar{display:none}
  .pane-chat{position:static;transform:none;inset:auto;z-index:1}
  #backBtn{display:none}
  .pane-list{border-right:1px solid var(--line)}
  .msg{max-width:65%}
}
/* ---------- DESKTOP ≥1280 : + details panel ---------- */
@media (min-width:1280px){
  .app{grid-template-columns:68px 340px 1fr 330px}
  .pane-details{display:flex;border-left:1px solid var(--line)}
  .msg{max-width:55%}
}
@media (min-width:1600px){.app{grid-template-columns:68px 380px 1fr 360px}}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="logo"><span class="mark">◆</span><h1>Nexus <em>Chat</em></h1></div>
    <p class="auth-sub">Connect with friends, communities and the world around you.</p>
    <div class="feat">

function pushMsg(chatId,m){const c=getChat(chatId);c.messages.push(m);
  if(m.from!=='me'&&(activeChat!==chatId||document.hidden))c.unread=(c.unread||0)+1;
  save();if(activeChat===chatId){renderMsgs()}renderList()}
function send(text,extra={}){if(!text&&!extra.img&&!extra.file&&!extra.voice)return;
  const m={id:uid(),from:'me',ts:Date.now(),status:'sent',text,...extra};if(replyTo){m.reply=replyTo;replyTo=null;$('#replybar').hidden=true}
  pushMsg(activeChat,m);setTimeout(()=>{if(m.status==='sent'){m.status='delivered';save();activeChat&&renderMsgs()}},500);
  botReply(activeChat)}
const BOT=['That sounds great! 🔥','Sure! Give me a few minutes','Yeah! It looks amazing! 🔥','Can you check the updated files?','Perfect! I\'ll handle it 🚀','Haha love that 😂','Okay, talk soon! 💜','Send me the details 🙏'];
function botReply(chatId){if(!state.bot||botTimers[chatId])return;const c=getChat(chatId);
  botTimers[chatId]=setTimeout(()=>{delete botTimers[chatId];c.typing=true;save();if(activeChat===chatId){renderMsgs();renderChatHeaderTyping()}
    setTimeout(()=>{c.typing=false;c.messages.forEach(m=>{if(m.from==='me')m.status='read'});
      pushMsg(chatId,{id:uid(),from:'them',ts:Date.now(),status:'sent',text:BOT[Math.random()*BOT.length|0],who:c.type==='group'?['Sofia','Marcus','Priya'][Math.random()*3|0]:undefined});
      if(activeChat===chatId)renderChatHeaderTyping()},1400+Math.random()*900)},600)}
function renderChatHeaderTyping(){const c=getChat(activeChat);const i=document.querySelector('.chead .who i');if(i&&c)i.className=c.typing?'typing':'',i.textContent=c.typing?'typing…':(c.online?'Online':c.type==='group'?'Group':'Last seen recently')}
function wireComposer(c){
  const inp=$('#msgIn'),sendB=$('#sendBtn');
  inp.addEventListener('input',()=>sendB.innerHTML=I(inp.value.trim()?'send':'mic'));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){send(inp.value.trim());inp.value='';sendB.innerHTML=I('mic')}});
  sendB.addEventListener('click',()=>{if(inp.value.trim()){send(inp.value.trim());inp.value='';sendB.innerHTML=I('mic')}else recordVoice()});
  $('#backBtn').addEventListener('click',closeChat);
  $('#attBtn').addEventListener('click',e=>{e.stopPropagation();$('#attachPop').hidden=!$('#attachPop').hidden;$('#emojiPop').hidden=true});
  $('#emoBtn').addEventListener('click',e=>{e.stopPropagation();const p=$('#emojiPop');p.hidden=!p.hidden;$('#attachPop').hidden=true;
    if(!p.innerHTML)p.innerHTML=['😀','😂','😍','🔥','🎉','','🙏','😎','','😢','','✨','','🎨','🎮','🎵','📚','☕','🌙','⭐','❤️','👀','','🥳'].map(e=>`<button data-e="${e}">${e}</button>`).join('')});
  $('#emojiPop').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b){inp.value+=b.dataset.e;inp.focus();sendB.innerHTML=I('send')}});
  $('#attachPop').addEventListener('click',e=>{const b=e.target.closest('[data-att]');if(!b)return;$('#attachPop').hidden=true;(b.dataset.att==='img'?$('#fileIn'):$('#docIn')).click()});
  $('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
    const img=new Image(),r=new FileReader();
    r.onload=()=>{img.onload=()=>{const cv=document.createElement('canvas'),s=Math.min(1,800/img.width);cv.width=img.width*s;cv.height=img.height*s;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);send('',{img:cv.toDataURL('image/jpeg',.7)})};img.src=r.result};r.readAsDataURL(f);e.target.value=''});
  $('#docIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
    send('',{file:{name:f.name,size:(f.size/1048576).toFixed(1)+' MB'}});e.target.value=''});
  document.addEventListener('click',()=>{$('#attachPop')&&($('#attachPop').hidden=true);$('#emojiPop')&&($('#emojiPop').hidden=true)},{once:false});
}
function recordVoice(){const bar=$('.composer .in');const old=bar.innerHTML;let s=0;
  bar.innerHTML=`<span style="color:var(--danger);font-weight:700">● REC</span><input id="recT" readonly value="0:00" style="text-align:center">`;
  const t=setInterval(()=>{s++;$('#recT').value=`0:${String(s).padStart(2,'0')}`},1000);
  const stop=()=>{clearInterval(t);bar.innerHTML=old;send('',{voice:String(s).padStart(2,'0')})};
  $('#sendBtn').innerHTML=I('chk');$('#sendBtn').onclick=()=>{stop();$('#sendBtn').onclick=null;$('#sendBtn').innerHTML=I('mic')}}

/* ================= SYNC / LIFECYCLE ================= */
function afterSync(){applyTheme();
  if(activeChat){const c=getChat(activeChat);if(c&&c.unread&&document.hasFocus()){c.unread=0;save(false)}}
  if(!state.session){location.reload();return}
  $$('#authTabs');renderList();if(activeChat){renderMsgs();renderChatHeaderTyping()}renderDetails();
  $$('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeChat){const c=getChat(activeChat);if(c&&c.unread){c.unread=0;save();renderList()}}});
$$('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme();save()});
document.addEventListener('click',e=>{const v=e.target.closest('[data-vcall]');if(v)openCall(v.dataset.vcall,'video')});
if(state.session)showApp();
</script>
</body>
</html>
